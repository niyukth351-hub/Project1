<!DOCTYPE html>
<html>
    <head>
        <title>Registration</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Event Registration</h1>
        </header>
        <nav>
            <a href="index.html">Home</a>
            <a href="events.html">Events</a>
            <a href="registration.html">Register</a>
            <a href="contact.html">Contact</a>
        </nav>
        <div class="content">
            <h2>Student Registration</h2>
            <form onsubmit="registerStudent(event)">
                <label>Name:</label>
                <input type="text" id="name" required>
                <label>Email:</label>
                <input type="email" required>
                <label>Department:</label>
                <input type="text" required>
                <label>Select Event:</label>
                <select id="event" required>
                    <option value="">Select Event</option>
                    <option>Web Development workshop</option>
                    <option>quiz Competition</option>
                    <option>Coding Competition</option>
                </select>
                <button type="submit">REgister</button>
            </form>
            <p id="message"></p>
        </div>
        <script>
            function registerStudent(event){
                event.preventDefault();
                let name=document.getElementById("name").value;
                let eventName=document.getElementById("event").value;
                document.getElementById("message").innerHTML="successfully Registered!<br>"+"Welcome"+name+"<br>"+"Event:"+eventName;
                document.getElementById("message").style.display="block";
            }
        </script>
    </body>
</html>
